name: Check New Releases & Auto-Update Manifest

on:
  workflow_dispatch:
    inputs:
      software:
        description: "Software o Fork ('pocketmine', 'axolotl-pm', 'altay')"
        required: false
        type: string
        default: "pocketmine"
      force_version:
        description: "Forzar verificación de una versión específica (ej: 5.44.3)"
        required: false
        type: string
      auto_pr:
        description: "Crear PR automáticamente si se detecta versión nueva"
        required: false
        type: boolean
        default: true
  repository_dispatch:
    types: [stubs-released, stubs-updated]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-releases:
    runs-on: ubuntu-latest
    outputs:
      software: ${{ steps.setup_software.outputs.software }}
      software_name: ${{ steps.setup_software.outputs.software_name }}
      version: ${{ steps.pm_release.outputs.version }}
      needs_update: ${{ steps.check.outputs.exists == 'false' }}
      mc_version: ${{ steps.release_details.outputs.mc_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────────
      # Setup PHP para scripts
      # ────────────────────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, json, zip

      # ────────────────────────────────────────────────────────────
      # Resolver software y configuración
      # ────────────────────────────────────────────────────────────
      - name: Setup software config
        id: setup_software
        run: |
          SOFTWARE="${{ github.event.client_payload.software || inputs.software || 'pocketmine' }}"
          REPO=$(jq -r --arg s "$SOFTWARE" '.forks[$s].repo // "pmmp/PocketMine-MP"' forks.json)
          NAME=$(jq -r --arg s "$SOFTWARE" '.forks[$s].name // $s' forks.json)
          TAG_PREFIX=$(jq -r --arg s "$SOFTWARE" '.forks[$s].tag_prefix // ""' forks.json)

          echo "software=$SOFTWARE" >> $GITHUB_OUTPUT
          echo "software_name=$NAME" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "tag_prefix=$TAG_PREFIX" >> $GITHUB_OUTPUT
          echo "✓ Software: $NAME ($SOFTWARE), Repo: $REPO"
          echo "✓ Trigger event: ${{ github.event_name }}"

      # ────────────────────────────────────────────────────────────
      # Obtener el último release
      # ────────────────────────────────────────────────────────────
      - name: Get latest release
        id: pm_release
        run: |
          REPO="${{ steps.setup_software.outputs.repo }}"
          TAG_PREFIX="${{ steps.setup_software.outputs.tag_prefix }}"
          FORCED_VERSION="${{ github.event.client_payload.version || inputs.force_version || '' }}"

          if [ -n "$FORCED_VERSION" ]; then
            LATEST="$FORCED_VERSION"
            echo "✓ Usando versión forzada/payload: $LATEST"
          else
            RAW_TAG=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/latest" \
              | jq -r '.tag_name')

            # Limpiar prefijo si existe
            if [ -n "$TAG_PREFIX" ] && [[ "$RAW_TAG" == "$TAG_PREFIX"* ]]; then
              LATEST="${RAW_TAG#$TAG_PREFIX}"
            elif [[ "$RAW_TAG" =~ ^v[0-9] ]]; then
              LATEST="${RAW_TAG#v}"
            else
              LATEST="$RAW_TAG"
            fi
            echo "✓ Último release en GitHub: $LATEST (raw tag: $RAW_TAG)"
          fi
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      # ────────────────────────────────────────────────────────────
      # Verificar si ya está en manifest.json
      # ────────────────────────────────────────────────────────────
      - name: Check if version already in manifest
        id: check
        run: |
          VERSION="${{ steps.pm_release.outputs.version }}"
          SOFTWARE="${{ steps.setup_software.outputs.software }}"

          EXISTS=$(jq --arg v "$VERSION" --arg s "$SOFTWARE" \
            '[.versions[] | select((.software // "pocketmine") == $s and .id == $v)] | length > 0' manifest.json)

          echo "exists=$EXISTS" >> $GITHUB_OUTPUT
          if [ "$EXISTS" = "true" ]; then
            echo "✓ Versión $SOFTWARE@$VERSION ya está en manifest"
          else
            echo "⚠ Versión $SOFTWARE@$VERSION NO está en manifest - se actualizará"
          fi

      # ────────────────────────────────────────────────────────────
      # Obtener detalles del release (Minecraft version, assets)
      # ────────────────────────────────────────────────────────────
      - name: Get release details
        id: release_details
        if: steps.check.outputs.exists == 'false'
        run: |
          REPO="${{ steps.setup_software.outputs.repo }}"
          VERSION="${{ steps.pm_release.outputs.version }}"
          TAG_PREFIX="${{ steps.setup_software.outputs.tag_prefix }}"
          FULL_TAG="${TAG_PREFIX}${VERSION}"

          RELEASE_DATA=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$FULL_TAG")

          BODY=$(echo "$RELEASE_DATA" | jq -r '.body // ""')
          PUBLISHED=$(echo "$RELEASE_DATA" | jq -r '.published_at // ""')

          # Intentar extraer versión de Minecraft del body del release
          MC_VERSION=$(echo "$BODY" | grep -oP 'Bedrock[^0-9]*\K[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "NEEDS_MANUAL_FILL")

          echo "published_at=$PUBLISHED" >> $GITHUB_OUTPUT
          echo "mc_version=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "✓ Versión Minecraft detectada: $MC_VERSION"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Actualizar manifest y crear PR automáticamente
  # ─────────────────────────────────────────────────────────────────────────────
  auto-update:
    needs: check-releases
    if: needs.check-releases.outputs.needs_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ────────────────────────────────────────────────────────────
      # Setup PHP
      # ────────────────────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, json, zip

      # ────────────────────────────────────────────────────────────
      # Configurar Git
      # ────────────────────────────────────────────────────────────
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # ────────────────────────────────────────────────────────────
      # Crear rama para los cambios
      # ────────────────────────────────────────────────────────────
      - name: Create feature branch
        run: |
          SOFTWARE="${{ needs.check-releases.outputs.software }}"
          VERSION="${{ needs.check-releases.outputs.version }}"
          CLEAN_VER="${VERSION//./}"
          BRANCH_NAME="feat/update-${SOFTWARE}-${CLEAN_VER}"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV

      # ────────────────────────────────────────────────────────────
      # Ejecutar update-manifest.php
      # ────────────────────────────────────────────────────────────
      - name: Update manifest with new version
        id: update
        run: |
          SOFTWARE="${{ needs.check-releases.outputs.software }}"
          VERSION="${{ needs.check-releases.outputs.version }}"
          MC_VERSION="${{ needs.check-releases.outputs.mc_version }}"

          echo "📦 Actualizando manifest para $SOFTWARE@$VERSION..."

          php scripts/update-manifest.php \
            --software="$SOFTWARE" \
            --version="$VERSION" \
            --mc-version="$MC_VERSION" \
            2>&1

          RESULT=$?
          if [ $RESULT -eq 0 ]; then
            echo "✓ Manifest actualizado exitosamente"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Error al actualizar manifest"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      # ────────────────────────────────────────────────────────────
      # Validar manifest.json
      # ────────────────────────────────────────────────────────────
      - name: Validate manifest
        run: |
          echo "🔍 Validando manifest.json..."
          php scripts/validate-manifest.php
          echo "✓ Manifest validado correctamente"

      # ────────────────────────────────────────────────────────────
      # Commit cambios
      # ────────────────────────────────────────────────────────────
      - name: Commit changes
        run: |
          SOFTWARE_NAME="${{ needs.check-releases.outputs.software_name }}"
          VERSION="${{ needs.check-releases.outputs.version }}"
          git add manifest.json
          git commit -m "feat: add $SOFTWARE_NAME $VERSION

          - Auto-update via GitHub Actions repository_dispatch
          - Multi-software / Fork support
          - SHA256 checksums verified
          - MC version: ${{ needs.check-releases.outputs.mc_version }}"

      # ────────────────────────────────────────────────────────────
      # Push y crear Pull Request
      # ────────────────────────────────────────────────────────────
      - name: Push branch and create PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MANIFEST_BOT_TOKEN }}
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const software = '${{ needs.check-releases.outputs.software }}';
            const softwareName = '${{ needs.check-releases.outputs.software_name }}';
            const version = '${{ needs.check-releases.outputs.version }}';
            const branchName = process.env.branch_name;
            const mcVersion = '${{ needs.check-releases.outputs.mc_version }}';

            console.log('📤 Pusheando rama...');
            execSync(`git push origin ${branchName}`, { stdio: 'inherit' });

            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const versionData = manifest.versions.find(v => (v.software || 'pocketmine') === software && v.id === version);

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🎉 Update: Add ${softwareName} ${version}`,
              head: branchName,
              base: 'main',
              body: [
                `## 🚀 Automated Version Update (${softwareName})`,
                ``,
                `### 📋 Details`,
                `| Field | Value |`,
                `|-------|-------|`,
                `| **Software** | \`${softwareName} (${software})\` |`,
                `| **Version** | \`${version}\` |`,
                `| **MC Version** | \`${mcVersion}\` |`,
                `| **API Version** | \`${versionData?.api_version || 'auto-detected'}\` |`,
                `| **Min PHP** | \`${versionData?.min_php || 'auto-detected'}\` |`,
                `| **Release Date** | \`${versionData?.release_date || 'N/A'}\` |`,
                ``,
                `### ✅ Automated Checks`,
                `- [x] \`update-manifest.php --software=${software} --version=${version}\` executed successfully`,
                `- [x] \`validate-manifest.php\` passed`,
                `- [x] SHA256 checksums verified`,
                `- [x] Stubs and PHAR URLs configured`,
                ``,
                `### 📦 Artifacts Downloaded & Verified`,
                `- Server PHAR`,
                `- PHP binaries`,
                `- PHP stubs for Intelephense / Deepslate`,
                `- All checksums computed and validated`,
                ``,
                `This PR was created automatically by GitHub Actions via \`repository_dispatch\`. Please review and merge if everything looks correct.`,
                ``,
                `---`,
                `*Deepslate Ecosystem — ImAMadDev/pocketmine-manifest*`,
              ].join('\n'),
              labels: ['automated', 'version-update', software],
            });

            console.log(`✅ PR created: ${pr.data.html_url}`);
            core.setOutput('pr_number', pr.data.number);
            core.setOutput('pr_url', pr.data.html_url);

      # ────────────────────────────────────────────────────────────
      # Resumen de la ejecución
      # ────────────────────────────────────────────────────────────
      - name: Print summary
        if: always()
        run: |
          echo "📊 === UPDATE SUMMARY ==="
          echo "Software: ${{ needs.check-releases.outputs.software_name }} (${{ needs.check-releases.outputs.software }})"
          echo "Version: ${{ needs.check-releases.outputs.version }}"
          echo "MC Version: ${{ needs.check-releases.outputs.mc_version }}"
          echo "Branch: $branch_name"
          echo ""
          echo "✅ Auto-update completed successfully!"
